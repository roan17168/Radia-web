<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Teal-Slate Squircle Background -->
    <linearGradient id="radiaAppBg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="52%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Aurora Emerald-Cyan Wave Gradient -->
    <linearGradient id="radiaAuroraRing" x1="22" y1="22" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Warm Golden Catalyst Spark Gradient -->
    <linearGradient id="radiaGoldenSpark" x1="48" y1="30" x2="80" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <radialGradient id="radiaCenterBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#0D9488" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <filter id="radiaIconDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#022C22" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- iOS / macOS Precision Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#radiaAppBg)" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.35" />

  <!-- Ambient Bioluminescent Center Bloom -->
  <circle cx="64" cy="64" r="48" fill="url(#radiaCenterBloom)" />

  <!-- Outer 40ft Proximity Ripple Ring -->
  <circle cx="64" cy="64" r="42" stroke="url(#radiaAuroraRing)" stroke-width="3" stroke-dasharray="8 6" opacity="0.65" />

  <!-- Inner Resonance Ring -->
  <circle cx="64" cy="64" r="29" stroke="#5EEAD4" stroke-width="2.2" opacity="0.85" />

  <!-- 3D Compass & Golden Catalyst Starburst -->
  <g filter="url(#radiaIconDrop)">
    <!-- North-South / East-West Compass Rose Petals -->
    <path d="M64 20L73.5 54.5L108 64L73.5 73.5L64 108L54.5 73.5L20 64L54.5 54.5L64 20Z" fill="url(#radiaAuroraRing)" />
    <!-- Warm Golden Inner Catalyst Diamond -->
    <path d="M64 31L70.5 57.5L97 64L70.5 70.5L64 97L57.5 70.5L31 64L57.5 57.5L64 31Z" fill="url(#radiaGoldenSpark)" />
    <!-- Crisp White Core Pearl -->
    <circle cx="64" cy="64" r="7.5" fill="#FFFFFF" />
    <circle cx="64" cy="64" r="3.5" fill="#0D9488" />
  </g>

  <!-- Top-Right Orbiting Neighbor Spark -->
  <circle cx="95" cy="33" r="5.5" fill="#FDE047" stroke="#FFFFFF" stroke-width="2" />
</svg>
